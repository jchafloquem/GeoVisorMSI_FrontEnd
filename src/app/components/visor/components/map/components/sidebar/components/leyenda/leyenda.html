<div
  class="flex flex-col w-96 rounded-lg border border-primary/30 bg-white shadow-2xl overflow-hidden animate-in fade-in slide-in-from-left-4 duration-300"
  [class.w-96]="!isMinimized()" [class.w-64]="isMinimized()">
  <!-- Cabecera -->
  <div class="flex items-center justify-between bg-primary px-4 py-3">
    <div class="flex items-center gap-2 text-white">
      <i class="bi bi-map me-2"></i>
      <h3 class="font-semibold text-sm">Leyenda del Mapa</h3>
    </div>
    <div class="flex items-center gap-1">
      <button (click)="toggleMinimize()"
        class="text-white/80 hover:text-white hover:bg-white/10 p-1 rounded-md transition-colors" title="Minimizar"
        [title]="isMinimized() ? 'Expandir' : 'Minimizar'">
        <i class="bi" [ngClass]="isMinimized() ? 'bi-plus-lg' : 'bi-dash-lg'"></i>
      </button>
      <button type="button" (click)="closePanel()"
        class="text-white/80 hover:text-white hover:bg-white/10 p-1 rounded-md transition-colors" title="Cerrar">
        <i class="bi bi-x-lg text-sm"></i>
      </button>
    </div>
  </div>
  <!-- Contenido de la leyenda -->
   @if(!isMinimized()) {
  <div class="p-3 space-y-3 overflow-y-auto flex-1 custom-scrollbar animate-in fade-in duration-300 max-h-[40vh]">
    @if (activeLegends().length === 0) {
      <p class="text-muted p-3">No hay capas activas con simbología.</p>
    } @else {
      @for (item of activeLegends(); track item.label) {
        <div class="legend-item mb-3 rounded-xl border border-gray-200 bg-white shadow-sm overflow-hidden p-3">
          <div class="legend-label mb-2 font-semibold text-gray-700 text-xs uppercase tracking-tight">{{ item.label }}</div>
          <div class="flex justify-center bg-gray-50/50 rounded-lg p-2">
            <img [src]="item.url" [alt]="item.label" class="img-fluid legend-img w-1/2 max-w-15 h-auto object-contain">
          </div>
        </div>
      }
    }
  </div>
  <!-- Pie de página -->
  <div class="border-t border-gray-100 p-4 bg-gray-50/80 animate-in slide-in-from-top-2 duration-200">
    <p class="text-[10px] text-gray-400 italic flex items-center gap-1">
      <i class="bi bi-info-circle"></i> La leyenda se actualiza automáticamente con las capas visibles.
    </p>
  </div>
}
</div>
